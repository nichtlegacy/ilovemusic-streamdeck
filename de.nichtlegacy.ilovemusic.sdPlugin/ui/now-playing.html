<!doctype html>
<html lang="en">
  <head>
    <title>Now Playing</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="shared/pi.css" />
    <script src="shared/pi.js"></script>
  </head>
  <body>
    <main class="panel">
      <section class="field">
        <span class="field-label">Channel Name</span>
        <label class="toggle">
          <input type="checkbox" data-setting="showChannelName" data-default="true" />
          <span>
            <span class="toggle-title">Show on the key</span>
            <span class="toggle-copy">Displays the tuned station above the song info.</span>
          </span>
        </label>
      </section>

      <section class="field">
        <span class="field-label">Song Info</span>
        <label class="toggle">
          <input type="checkbox" data-setting="showSongInfo" data-default="false" />
          <span>
            <span class="toggle-title">Show artist and title</span>
            <span class="toggle-copy">Adds the current track metadata to the tile title.</span>
          </span>
        </label>
      </section>
    </main>
  </body>
</html>
