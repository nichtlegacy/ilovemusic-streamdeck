<!doctype html>
<html lang="en">
  <head>
    <title>Select Channel</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="shared/pi.css" />
    <script src="shared/pi.js"></script>
  </head>
  <body>
    <main class="panel">
      <section class="field">
        <label class="field-label" for="stationId">Channel</label>
        <select id="stationId" class="select" data-setting="stationId" data-default="">
          <option value="">Loading channels…</option>
        </select>
        <p class="hint">The list is loaded from the running ILOVEMusic app and refreshed through the plugin runtime.</p>
      </section>
    </main>

    <script>
      PI.onPluginMessage((payload) => {
        if (!payload || payload.event !== "getStations" || !Array.isArray(payload.items)) return;
        PI.replaceOptions("stationId", payload.items, "Select a station");
      });

      window.addEventListener("pi-ready", () => {
        PI.sendToPlugin({ event: "getStations" });
      });
    </script>
  </body>
</html>
