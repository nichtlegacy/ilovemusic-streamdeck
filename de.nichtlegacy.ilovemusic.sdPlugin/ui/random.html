<!doctype html>
<html lang="en">
  <head>
    <title>Random Channel</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="shared/pi.css" />
    <script src="shared/pi.js"></script>
  </head>
  <body>
    <main class="panel">
      <section class="field">
        <label class="field-label" for="pool">Channel Pool</label>
        <select id="pool" class="select" data-setting="pool" data-default="all">
          <option value="all">All channels</option>
          <option value="favorites">Favorites only</option>
        </select>
        <p class="hint">Choose whether the random action may pull from all channels or only favorites.</p>
      </section>
    </main>
  </body>
</html>
