<!doctype html>
<html lang="en">
  <head>
    <title>Volume Step</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="shared/pi.css" />
    <script src="shared/pi.js"></script>
  </head>
  <body>
    <main class="panel">
      <section class="field">
        <label class="field-label" for="direction">Direction</label>
        <select id="direction" class="select" data-setting="direction" data-default="up">
          <option value="up">Louder (+)</option>
          <option value="down">Quieter (-)</option>
        </select>
      </section>

      <section class="field">
        <label class="field-label" for="stepPercent">Step Size</label>
        <select id="stepPercent" class="select" data-setting="stepPercent" data-default="5">
          <option value="1">1 %</option>
          <option value="5">5 %</option>
          <option value="10">10 %</option>
          <option value="15">15 %</option>
          <option value="20">20 %</option>
        </select>
      </section>
    </main>
  </body>
</html>
