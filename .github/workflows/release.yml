name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Pack and publish
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify the tag matches the packaged version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          npm run version:check
          package_version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${package_version}" ]; then
            echo "error: tag ${TAG} does not match package.json ${package_version}" >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pack
        run: ./Scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes_file=".github/release-notes/${TAG#v}.md"
          if [ -f "$notes_file" ]; then
            gh release create "$TAG" dist/*.streamDeckPlugin \
              --title "ILOVEMusic Stream Deck ${TAG#v}" --notes-file "$notes_file"
          else
            gh release create "$TAG" dist/*.streamDeckPlugin \
              --title "ILOVEMusic Stream Deck ${TAG#v}" --generate-notes
          fi
